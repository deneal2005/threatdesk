# ThreatDesk NEVER invents contact addresses or report URLs. Every value below is empty on purpose.
# Fill them in yourself from each platform's official abuse / impersonation / trademark reporting pages,
# and re-check them periodically: platforms move these pages.
#
# Domain registrar and hosting abuse contacts are NOT configured here: they come from RDAP data captured
# during the investigation of each finding.

